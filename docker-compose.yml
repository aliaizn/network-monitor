version: '3.8'

services:
  db:
    image: postgres:16
    container_name: monitor-db
    environment:
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: monitoring
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped

  app:
    build: .
    container_name: monitor-app
    ports:
      - "5000:5000"
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_NAME: monitoring
      DB_USER: postgres
      DB_PASS: devpass
    cap_add:
      - NET_RAW
    restart: unless-stopped


volumes:
  db-data:
